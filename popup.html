<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 280px; padding: 14px; }
      .stack > * + * { margin-top: 14px; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
      .foot { display: flex; justify-content: space-between; align-items: center; }
      .foot a { color: var(--muted); font-size: 12px; text-decoration: none; }
      .foot a:hover { color: var(--accent); text-decoration: underline; }
      kbd {
        font: 11px ui-monospace, Menlo, monospace;
        border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; padding: 1px 5px; color: var(--muted);
      }
      #site { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      #site input { accent-color: var(--accent); margin: 0; }
      #host { font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="row">
        <h1>Bionic Reading</h1>
        <label class="switch">
          <input type="checkbox" id="power" aria-label="Toggle bionic reading on this page" />
          <span></span>
        </label>
      </div>

      <div>
        <div class="row">
          <label for="strength">Strength</label>
          <span class="val" id="strengthVal">40%</span>
        </div>
        <input type="range" id="strength" min="10" max="90" step="5" />
      </div>

      <div class="sample" id="sample"></div>

      <label id="site">
        <input type="checkbox" id="pin" />
        <span>Always on for <span id="host">this site</span></span>
      </label>

      <hr />

      <div class="foot">
        <a href="#" id="opts">All settings</a>
        <kbd>Alt</kbd> <kbd>B</kbd>
      </div>
    </div>

    <script src="defaults.js"></script>
    <script src="content.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
